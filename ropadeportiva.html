<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ropa Deportiva - Mi Boutique</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://images.unsplash.com/photo-1595909315417-2edd382a56dc?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="main-nav">
    <a href="index.html" class="logo">MI <span>CLOSET ONLINE</span></a>

    <div class="buscador-container">
        <input type="text" placeholder="¿Qué prenda buscas hoy?..." id="input-busqueda">
        <button id="btn-buscar"><i class="fas fa-search"></i></button>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html#categorias">Categorías</a></li>
        <li><a href="sobre-mi.html">Sobre mí</a></li>
        
        <div class="social-icons-menu">
            <a href="https://www.instagram.com/tu_usuario" class="icon-nav" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://wa.me/50661017807" class="icon-nav" target="_blank">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </ul>
</nav>

    <h2 class="section-title">Nuestra <span>Ropa Deportiva</span></h2>

   <div id="contenedor-productos" class="productos-grid">
        <p>Cargando lo mejor para entrenar...</p>
    </div>

    <script>
        const URL_CSV = "TU_LINK_DE_GOOGLE_AQUI_output=csv";

        async function cargarDeportiva() {
            try {
                const respuesta = await fetch(URL_CSV);
                const datos = await respuesta.text();
                const filas = datos.split('\n').slice(1); 
                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = ""; 

                let contador = 0;
                filas.forEach(fila => {
                    const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columnas.length >= 4) {
                        const nombre = columnas[0].replace(/"/g, "").trim();
                        const precio = columnas[1].replace(/"/g, "").trim();
                        const imagen = columnas[2].replace(/"/g, "").trim();
                        const categoria = columnas[3].replace(/"/g, "").trim().toLowerCase();
                        const linkWA = columnas[4] ? columnas[4].replace(/"/g, "").trim() : "#";

                        // FILTRO: Buscamos "deportiva" o "gym"
                        if (categoria.includes("deportiva") || categoria.includes("gym")) {
                            contador++;
                            contenedor.innerHTML += `
                                <div class="product-card">
                                    <img src="${imagen}" alt="${nombre}">
                                    <div class="product-info">
                                        <h3>${nombre}</h3>
                                        <span class="price">${precio}</span>
                                        <a href="${linkWA}" class="buy-btn" target="_blank">Consultar por WhatsApp</a>
                                    </div>
                                </div>`;
                        }
                    }
                });
                if (contador === 0) { contenedor.innerHTML = "<p>Nuevos sets deportivos próximamente.</p>"; }
            } catch (error) { console.error("Error:", error); }
        }
        cargarDeportiva();
    </script>

</body>
</html>
