    <h2 class="section-title">Nuestras <span>Blusas</span></h2>
    
   <!-- El contenedor que JavaScript llenará solito -->
<div id="contenedor-productos" class="productos-grid">
    <p>Cargando colección de blusas...</p>
</div>

<script>
    // 1. PEGA AQUÍ EL MISMO LINK DE GOOGLE SHEETS QUE USASTE EN ZAPATOS
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvb3K5GJjg7cCr_okiBgdrquV96ghTw6Tjk0nxO2bY54Zo0SKI98fUGPWfputKzrVne5o8rD0SvVxK/pub?output=csv";

    async function cargarBlusas() {
        try {
            const respuesta = await fetch(URL_CSV);
            const datos = await respuesta.text();
            
            const filas = datos.split('\n').slice(1); 
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = ""; 

            let contador = 0;

            filas.forEach(fila => {
                const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                if (columnas.length >= 4) {
                    const nombre = columnas[0].replace(/"/g, "").trim();
                    const precio = columnas[1].replace(/"/g, "").trim();
                    const imagen = columnas[2].replace(/"/g, "").trim();
                    const categoria = columnas[3].replace(/"/g, "").trim().toLowerCase();
                    const linkWA = columnas[4] ? columnas[4].replace(/"/g, "").trim() : "#";

                    // FILTRO MÁGICO: Aquí solo buscamos "blusas"
                    if (categoria.includes("Blusas")) {
                        contador++;
                        contenedor.innerHTML += `
                            <div class="product-card">
                                <img src="${imagen}" alt="${nombre}">
                                <div class="product-info">
                                    <h3>${nombre}</h3>
                                    <span class="price">${precio}</span>
                                    <a href="${linkWA}" class="buy-btn" target="_blank">
                                        Consultar por WhatsApp
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                }
            });

            if (contador === 0) {
                contenedor.innerHTML = "<p>Muy pronto tendremos nuevas blusas disponibles.</p>";
            }

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('contenedor-productos').innerHTML = "Error al conectar con el inventario.";
        }
    }

    cargarBlusas();
</script>

</body>
</html>
