   <h2 class="section-title">Nuestra Colección de <span>Enaguas</span></h2>

<!-- El contenedor que JavaScript llenará con el Excel -->
<div id="contenedor-productos" class="productos-grid">
    <p>Cargando las mejores enaguas para ti...</p>
</div>

<script>
    // 1. PEGA AQUÍ TU MISMO LINK DE GOOGLE SHEETS (el que termina en output=csv)
    const URL_CSV = "TU_LINK_DE_GOOGLE_AQUI_QUE_TERMINA_EN_output=csv";

    async function cargarEnaguas() {
        try {
            const respuesta = await fetch(URL_CSV);
            const datos = await respuesta.text();
            
            const filas = datos.split('\n').slice(1); 
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = ""; 

            let contador = 0;

            filas.forEach(fila => {
                const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                if (columnas.length >= 4) {
                    const nombre = columnas[0].replace(/"/g, "").trim();
                    const precio = columnas[1].replace(/"/g, "").trim();
                    const imagen = columnas[2].replace(/"/g, "").trim();
                    const categoria = columnas[3].replace(/"/g, "").trim().toLowerCase();
                    const linkWA = columnas[4] ? columnas[4].replace(/"/g, "").trim() : "#";

                    // FILTRO: Solo mostramos lo que diga "Enagua"
                    if (categoria.includes("enagua")) {
                        contador++;
                        contenedor.innerHTML += `
                            <div class="product-card">
                                <img src="${imagen}" alt="${nombre}">
                                <div class="product-info">
                                    <h3>${nombre}</h3>
                                    <span class="price">${precio}</span>
                                    <a href="${linkWA}" class="buy-btn" target="_blank">
                                        Consultar por WhatsApp
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                }
            });

            if (contador === 0) {
                contenedor.innerHTML = "<p>Nuevas enaguas en camino. ¡Vuelve pronto!</p>";
            }

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('contenedor-productos').innerHTML = "No pudimos cargar el inventario.";
        }
    }

    cargarEnaguas();
</script>
